name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'schedule-app/**'
      - 'android/**'
      - 'native/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-build.yml'

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build native bridge
        run: npm run build:native

      - name: Sync Capacitor assets
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle-build.log
          exit ${PIPESTATUS[0]}

      - name: Report Gradle errors
        if: failure()
        run: |
          if [ -f gradle-build.log ]; then
            awk '/What went wrong/{found=1} found{print; count++} count>16{exit}' gradle-build.log |
              sed 's/\r$//' | head -n 16 | while IFS= read -r line; do
                echo "::error title=GradleErr::$line"
              done
            if ! grep -q "What went wrong" gradle-build.log; then
              tail -n 16 gradle-build.log | sed 's/\r$//' | while IFS= read -r line; do
                echo "::error title=GradleTail::$line"
              done
          fi

      - name: Inspect APK
        working-directory: android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -la "$APK"
          sha256sum "$APK"
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | tail -1)
          if [ -n "$AAPT" ]; then "$AAPT" dump badging "$APK" | head -8; fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: schedule-app-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
